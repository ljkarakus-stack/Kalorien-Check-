<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kalorien-Check ist umgezogen</title>
<meta name="theme-color" content="#6E1A2E">
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #FBF1EC; color: #6E1A2E; font: 600 18px/1.5 system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  a { color: #6E1A2E; }
</style>
</head>
<body>
<p id="msg">Die App ist umgezogen – einen Moment, deine Daten kommen mit …</p>
<script>
// The app moved to its own domain. Data in the browser belongs to the old address,
// so it is packed into the link (after #, never sent to any server) and unpacked there.
const NEW = "https://app.jamileo.com/";
const PREFIX = "jamileo-kalorien-check";

async function pack(obj) {
  const gz = new Blob([JSON.stringify(obj)]).stream().pipeThrough(new CompressionStream("gzip"));
  const bytes = new Uint8Array(await new Response(gz).arrayBuffer());
  let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}

(async () => {
  let target = NEW + location.hash; // recipe and challenge links keep working
  try {
    const data = {};
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k.startsWith(PREFIX) && !k.endsWith("-moved")) data[k] = localStorage.getItem(k);
    }
    if (data[PREFIX + "-v1"] && !localStorage.getItem(PREFIX + "-moved")) {
      target = NEW + "#umzug=" + await pack(data);
      localStorage.setItem(PREFIX + "-moved", "1");
    }
  } catch (e) { /* no storage access: just forward */ }
  document.getElementById("msg").innerHTML = `Die App ist umgezogen: <a href="${NEW}">${NEW.replace("https://", "").replace(/\/$/, "")}</a>`;
  location.replace(target);
})();
</script>
</body>
</html>
